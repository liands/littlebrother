; MODELO sem credenciais. O arquivo usado e config.ini na raiz do projeto.
; Execute configurar-apis.bat para criar/editar o config.ini.
; Cole somente o valor, sem aspas. Deixe vazio o que nao utilizar.
; Variaveis de ambiente de mesmo nome prevalecem sobre este arquivo.

[api_keys]
; https://haveibeenpwned.com/API/Key - acesso/plano para consultas de email.
HIBP_API_KEY =
; https://hunter.io/api-keys - chave do Email Verifier.
HUNTER_API_KEY =
; https://app.kickbox.com/ - API Settings > Add API Key.
KICKBOX_API_KEY =
; https://checkleaked.cc/botLinks - Bot Token da conta Free (nao e token de bot Telegram/Discord).
CHECKLEAKED_API_KEY =

[email_lookup]
; true ativa; false desativa. Sem chave, a fonte e marcada nao configurada.
hibp_enabled = true
hunter_enabled = true
kickbox_enabled = true
; Free: 2 buscas/dia. Habilite apos preencher o Bot Token. A tela pede confirmacao.
checkleaked_enabled = false
; Se usar uma chave Sandbox da Kickbox, mude para true (dados simulados).
kickbox_sandbox = false
; Hunter pode retornar 202 (processando). De 1 a 2 tentativas por consulta.
hunter_max_attempts = 2
; Timeout solicitado a Kickbox, em milissegundos. De 1000 a 10000.
kickbox_timeout_ms = 6000
